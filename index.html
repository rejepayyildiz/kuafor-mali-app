<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Kuaför Mali Yönetim</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--bg2:#f5f5f7;--bg3:#e8e8ed;--tx:#1d1d1f;--tx2:#6e6e73;--tx3:#aeaeb2;--green:#34c759;--red:#ff3b30;--blue:#007aff;--orange:#ff9500;--card:#fff;--border:#e5e5ea;--shadow:0 1px 3px rgba(0,0,0,.06);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--tx:#f5f5f7;--tx2:#98989d;--tx3:#636366;--card:#1c1c1e;--border:#38383a;--shadow:none}}
html,body{height:100%;background:var(--bg);color:var(--tx);font-size:16px;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.header{padding:12px 20px 8px;background:var(--bg)}
.header h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.header p{font-size:13px;color:var(--tx2);margin-top:2px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:0.5px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,8px);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;border:none;background:none;color:var(--tx3);font-size:10px;font-family:inherit;transition:color .2s}
.tab.active{color:var(--blue)}
.tab svg{width:22px;height:22px}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin:0 20px 12px}
.card-sm{padding:12px 16px}
.balance-row{display:flex;gap:10px;padding:0 20px;margin-bottom:16px}
.balance-card{flex:1;background:var(--bg2);border-radius:14px;padding:14px}
.balance-card .label{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.balance-card .amount{font-size:22px;font-weight:600}
.section-title{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;padding:16px 20px 8px}
.list-item{display:flex;align-items:center;padding:12px 20px;gap:12px;cursor:pointer;transition:background .15s}
.list-item:active{background:var(--bg2)}
.list-item .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.list-item .info{flex:1;min-width:0}
.list-item .info .name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .info .meta{font-size:12px;color:var(--tx2);margin-top:1px}
.list-item .amount{font-size:15px;font-weight:600;text-align:right;flex-shrink:0}
.list-item+.list-item{border-top:0.5px solid var(--border)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.8}
.btn-primary{background:var(--blue);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--tx)}
.fab{position:fixed;bottom:100px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:99;box-shadow:0 4px 12px rgba(0,122,255,.35);transition:transform .15s}
.fab:active{transform:scale(.9)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px 20px env(safe-area-inset-bottom,20px)}
.modal-handle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:0 auto 16px}
.modal h2{font-size:20px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--tx2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:var(--bg2);color:var(--tx);outline:none;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus{border-color:var(--blue)}
.form-group textarea{min-height:60px;resize:vertical}
.seg-control{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:14px;font-weight:500;background:transparent;color:var(--tx2);cursor:pointer;font-family:inherit;transition:all .2s}
.seg-btn.active{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--tx);cursor:pointer;font-family:inherit;transition:all .15s}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{text-align:center;padding:40px 20px;color:var(--tx2)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
.empty p{font-size:14px}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-green{background:rgba(52,199,89,.15);color:var(--green)}
.tag-red{background:rgba(255,59,48,.15);color:var(--red)}
.tag-blue{background:rgba(0,122,255,.15);color:var(--blue)}
.tag-orange{background:rgba(255,149,0,.15);color:var(--orange)}
.report-card{background:var(--bg2);border-radius:14px;padding:16px;margin-bottom:10px}
.report-card .rc-label{font-size:12px;color:var(--tx2);margin-bottom:4px}
.report-card .rc-val{font-size:20px;font-weight:700}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:0 20px;margin-bottom:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:6px 6px 0 0;transition:height .4s ease;min-height:2px}
.bar-label{font-size:10px;color:var(--tx2)}
.swipe-actions{display:flex;gap:8px;margin-top:10px}
.swipe-actions button{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.act-edit{background:var(--bg2);color:var(--tx)}
.act-del{background:rgba(255,59,48,.1);color:var(--red)}
.period-tabs{display:flex;gap:0;padding:0 20px;margin-bottom:16px}
.period-tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.period-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.stock-price{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.stock-price.up{color:var(--green)}
.stock-price.down{color:var(--red)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:300;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo} = React;

// Storage
const DB={
  get(k){try{return JSON.parse(localStorage.getItem('kf_'+k))}catch{return null}},
  set(k,v){localStorage.setItem('kf_'+k,JSON.stringify(v))},
  del(k){localStorage.removeItem('kf_'+k)}
};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>{
  const abs=Math.abs(n);
  if(abs>=1e6)return (n/1e6).toFixed(1)+'M';
  return n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const fmtDate=d=>new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});
const fmtShort=d=>new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
const today=()=>new Date().toISOString().split('T')[0];
const pmLabels={cash:'Nakit',card:'Kart',transfer:'Havale'};
const regLabels={business:'Is Yeri Kasasi',home:'Ev Kasasi'};
const catIncome=['Sac Kesim','Sac Boyasi','Makyaj','Cilt Bakim','Tirnak','Masaj','Diger'];
const catExpense=['Malzeme','Kira','Elektrik','Su','Internet','Personel','Vergi','Diger'];

// Icons
const Icons={
  home:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  list:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
  wallet:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
  box:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
  chart:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
  plus:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  down:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="7 10 12 15 17 10"/></svg>,
  up:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="7 14 12 9 17 14"/></svg>,
  empty:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>,
};

// Toast
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2000);return()=>clearTimeout(t)},[]);
  return <div className="toast">{msg}</div>;
}

// Modal
function Modal({open,onClose,children}){
  if(!open)return null;
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal">
      <div className="modal-handle"/>
      {children}
    </div>
  </div>;
}

// SegControl
function Seg({options,value,onChange}){
  return <div className="seg-control">
    {options.map(o=><button key={o.value} className={`seg-btn ${value===o.value?'active':''}`} onClick={()=>onChange(o.value)}>{o.label}</button>)}
  </div>;
}

// TransactionForm
function TransactionForm({item,onSave,onClose,onDelete}){
  const [type,setType]=useState(item?.type||'income');
  const [desc,setDesc]=useState(item?.desc||'');
  const [amount,setAmount]=useState(item?.amount?.toString()||'');
  const [pm,setPm]=useState(item?.pm||'cash');
  const [reg,setReg]=useState(item?.reg||'business');
  const [cat,setCat]=useState(item?.cat||'');
  const [date,setDate]=useState(item?.date||today());
  const [notes,setNotes]=useState(item?.notes||'');
  const cats=type==='income'?catIncome:catExpense;
  const save=()=>{
    if(!desc||!amount)return;
    onSave({id:item?.id||uid(),type,desc,amount:parseFloat(amount),pm,reg,cat:cat||cats[0],date,notes,ts:Date.now()});
  };
  return <>
    <h2>{item?'Duzenle':'Yeni Islem'}</h2>
    <Seg options={[{value:'income',label:'Gelir'},{value:'expense',label:'Gider'}]} value={type} onChange={setType}/>
    <div className="form-group"><label>Aciklama</label><input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="ornek: Sac Kesim"/></div>
    <div className="form-group"><label>Tutar (TL)</label><input type="number" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00"/></div>
    <div className="form-group"><label>Odeme Yontemi</label>
      <div className="chip-row">{['cash','card','transfer'].map(p=><button key={p} className={`chip ${pm===p?'active':''}`} onClick={()=>setPm(p)}>{pmLabels[p]}</button>)}</div>
    </div>
    <div className="form-group"><label>Kasa</label>
      <Seg options={[{value:'business',label:'Is Yeri'},{value:'home',label:'Ev'}]} value={reg} onChange={setReg}/>
    </div>
    <div className="form-group"><label>Kategori</label>
      <div className="chip-row">{cats.map(c=><button key={c} className={`chip ${cat===c?'active':''}`} onClick={()=>setCat(c)}>{c}</button>)}</div>
    </div>
    <div className="form-group"><label>Tarih</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
    <div className="form-group"><label>Not</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Opsiyonel not..."/></div>
    <button className="btn btn-primary" onClick={save} style={{marginBottom:8}}>Kaydet</button>
    {item&&<button className="btn btn-danger" onClick={()=>onDelete(item.id)}>Sil</button>}
    <button className="btn btn-outline" onClick={onClose} style={{marginTop:8}}>Iptal</button>
  </>;
}

// StockForm
function StockForm({item,onSave,onClose,onDelete}){
  const [name,setName]=useState(item?.name||'');
  const [supplier,setSupplier]=useState(item?.supplier||'');
  const [buyPrice,setBuyPrice]=useState(item?.buyPrice?.toString()||'');
  const [curPrice,setCurPrice]=useState(item?.curPrice?.toString()||'');
  const [qty,setQty]=useState(item?.qty?.toString()||'');
  const [date,setDate]=useState(item?.date||today());
  const [notes,setNotes]=useState(item?.notes||'');
  const save=()=>{
    if(!name||!buyPrice||!qty)return;
    onSave({id:item?.id||uid(),name,supplier,buyPrice:parseFloat(buyPrice),curPrice:parseFloat(curPrice||buyPrice),qty:parseInt(qty),date,notes,ts:Date.now()});
  };
  return <>
    <h2>{item?'Stok Duzenle':'Yeni Stok'}</h2>
    <div className="form-group"><label>Urun Adi</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="ornek: Sac Boyasi"/></div>
    <div className="form-group"><label>Tedarikci</label><input value={supplier} onChange={e=>setSupplier(e.target.value)} placeholder="Tedarikci adi"/></div>
    <div className="form-group"><label>Alis Fiyati (TL)</label><input type="number" inputMode="decimal" value={buyPrice} onChange={e=>setBuyPrice(e.target.value)}/></div>
    <div className="form-group"><label>Guncel Fiyat (TL)</label><input type="number" inputMode="decimal" value={curPrice} onChange={e=>setCurPrice(e.target.value)}/></div>
    <div className="form-group"><label>Miktar (Adet)</label><input type="number" inputMode="numeric" value={qty} onChange={e=>setQty(e.target.value)}/></div>
    <div className="form-group"><label>Alis Tarihi</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
    <div className="form-group"><label>Not</label><textarea value={notes} onChange={e=>setNotes(e.target.value)}/></div>
    <button className="btn btn-primary" onClick={save} style={{marginBottom:8}}>Kaydet</button>
    {item&&<button className="btn btn-danger" onClick={()=>onDelete(item.id)}>Sil</button>}
    <button className="btn btn-outline" onClick={onClose} style={{marginTop:8}}>Iptal</button>
  </>;
}

// MAIN APP
function App(){
  const [tab,setTab]=useState('home');
  const [txns,setTxns]=useState(()=>DB.get('txns')||[]);
  const [stock,setStock]=useState(()=>DB.get('stock')||[]);
  const [modal,setModal]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [toast,setToast]=useState('');
  const [period,setPeriod]=useState('month');
  const [expanded,setExpanded]=useState(null);

  useEffect(()=>{DB.set('txns',txns)},[txns]);
  useEffect(()=>{DB.set('stock',stock)},[stock]);

  const show=msg=>{setToast(msg);};

  // Transaction CRUD
  const saveTxn=t=>{
    setTxns(prev=>{const idx=prev.findIndex(x=>x.id===t.id);if(idx>=0){const n=[...prev];n[idx]=t;return n}return[t,...prev]});
    setModal(null);setEditItem(null);show('Kaydedildi');
  };
  const delTxn=id=>{setTxns(prev=>prev.filter(x=>x.id!==id));setModal(null);setEditItem(null);show('Silindi')};
  
  // Stock CRUD
  const saveStock=s=>{
    setStock(prev=>{const idx=prev.findIndex(x=>x.id===s.id);if(idx>=0){const n=[...prev];n[idx]=s;return n}return[s,...prev]});
    setModal(null);setEditItem(null);show('Kaydedildi');
  };
  const delStock=id=>{setStock(prev=>prev.filter(x=>x.id!==id));setModal(null);setEditItem(null);show('Silindi')};

  // Calculations
  const calcBalance=(register)=>{
    const filtered=txns.filter(t=>t.reg===register);
    const inc=filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const exp=filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    return {inc,exp,net:inc-exp};
  };
  const biz=calcBalance('business');
  const hom=calcBalance('home');
  const total={inc:biz.inc+hom.inc,exp:biz.exp+hom.exp,net:biz.net+hom.net};

  // Period filter
  const now=new Date();
  const periodFilter=useCallback((t)=>{
    const d=new Date(t.date);
    if(period==='day')return d.toDateString()===now.toDateString();
    if(period==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w}
    if(period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(period==='year')return d.getFullYear()===now.getFullYear();
    return true;
  },[period]);

  const periodTxns=useMemo(()=>txns.filter(periodFilter),[txns,periodFilter]);
  const pInc=periodTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const pExp=periodTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

  // Chart data (last 7 days)
  const chartData=useMemo(()=>{
    const days=[];
    for(let i=6;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const ds=d.toISOString().split('T')[0];
      const dayTxns=txns.filter(t=>t.date===ds);
      const inc=dayTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const exp=dayTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      days.push({label:d.toLocaleDateString('tr-TR',{weekday:'short'}).slice(0,3),inc,exp});
    }
    return days;
  },[txns]);
  const chartMax=Math.max(...chartData.flatMap(d=>[d.inc,d.exp]),1);

  // Stock total
  const stockTotal=stock.reduce((s,i)=>s+i.curPrice*i.qty,0);

  // HOME TAB
  const HomeTab=()=><div className="screen">
    <div className="header"><h1>Kuafor Mali</h1><p>{now.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div>
    <div className="balance-row">
      <div className="balance-card"><div className="label">Is Yeri Kasasi</div><div className="amount" style={{color:biz.net>=0?'var(--green)':'var(--red)'}}>₺{fmt(biz.net)}</div></div>
      <div className="balance-card"><div className="label">Ev Kasasi</div><div className="amount" style={{color:hom.net>=0?'var(--green)':'var(--red)'}}>₺{fmt(hom.net)}</div></div>
    </div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}><span style={{fontSize:13,fontWeight:600,color:'var(--tx2)'}}>Son 7 Gun</span><span style={{fontSize:13,color:'var(--tx2)'}}>Gelir / Gider</span></div>
      <div className="bar-chart">
        {chartData.map((d,i)=><div key={i} className="bar-col">
          <div style={{display:'flex',gap:2,alignItems:'flex-end',height:'100%',width:'100%'}}>
            <div className="bar" style={{flex:1,height:`${(d.inc/chartMax)*100}%`,background:'var(--green)',opacity:.7}}/>
            <div className="bar" style={{flex:1,height:`${(d.exp/chartMax)*100}%`,background:'var(--red)',opacity:.7}}/>
          </div>
          <div className="bar-label">{d.label}</div>
        </div>)}
      </div>
    </div>
    <div className="report-grid">
      <div className="report-card"><div className="rc-label">Toplam Gelir</div><div className="rc-val" style={{color:'var(--green)'}}>₺{fmt(total.inc)}</div></div>
      <div className="report-card"><div className="rc-label">Toplam Gider</div><div className="rc-val" style={{color:'var(--red)'}}>₺{fmt(total.exp)}</div></div>
    </div>
    <div className="section-title">Son Islemler</div>
    {txns.slice(0,5).map(t=><div key={t.id} className="list-item" onClick={()=>{setEditItem(t);setModal('txn')}}>
      <div className="icon" style={{background:t.type==='income'?'rgba(52,199,89,.12)':'rgba(255,59,48,.12)',color:t.type==='income'?'var(--green)':'var(--red)'}}>{t.type==='income'?'↓':'↑'}</div>
      <div className="info"><div className="name">{t.desc}</div><div className="meta">{fmtShort(t.date)} · {pmLabels[t.pm]} · {regLabels[t.reg]?.split(' ')[0]}</div></div>
      <div className="amount" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>{t.type==='income'?'+':'−'}₺{fmt(t.amount)}</div>
    </div>)}
    {txns.length===0&&<div className="empty">{Icons.empty}<p>Henuz islem yok.<br/>+ butonuna basarak ekleyin.</p></div>}
  </div>;

  // TRANSACTIONS TAB
  const TxnTab=()=><div className="screen">
    <div className="header"><h1>Islemler</h1><p>{txns.length} kayit</p></div>
    {txns.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t=><div key={t.id} className="list-item" onClick={()=>{setExpanded(expanded===t.id?null:t.id)}}>
      <div className="icon" style={{background:t.type==='income'?'rgba(52,199,89,.12)':'rgba(255,59,48,.12)',color:t.type==='income'?'var(--green)':'var(--red)'}}>{t.type==='income'?'↓':'↑'}</div>
      <div className="info">
        <div className="name">{t.desc}</div>
        <div className="meta">{fmtDate(t.date)} · {pmLabels[t.pm]} · {t.cat}</div>
        {expanded===t.id&&<div className="swipe-actions">
          <button className="act-edit" onClick={e=>{e.stopPropagation();setEditItem(t);setModal('txn')}}>Duzenle</button>
          <button className="act-del" onClick={e=>{e.stopPropagation();delTxn(t.id)}}>Sil</button>
        </div>}
      </div>
      <div style={{textAlign:'right'}}>
        <div className="amount" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>{t.type==='income'?'+':'−'}₺{fmt(t.amount)}</div>
        <span className={`tag ${t.reg==='business'?'tag-blue':'tag-orange'}`}>{t.reg==='business'?'Is Yeri':'Ev'}</span>
      </div>
    </div>)}
    {txns.length===0&&<div className="empty">{Icons.empty}<p>Islem bulunamadi</p></div>}
  </div>;

  // CASH REGISTER TAB
  const CashTab=()=><div className="screen">
    <div className="header"><h1>Kasa Yonetimi</h1></div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <span style={{fontSize:15,fontWeight:600}}>Is Yeri Kasasi</span>
        <span style={{fontSize:20,fontWeight:700,color:biz.net>=0?'var(--green)':'var(--red)'}}>₺{fmt(biz.net)}</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--tx2)'}}>
        <span>Gelir: <span style={{color:'var(--green)'}}>₺{fmt(biz.inc)}</span></span>
        <span>Gider: <span style={{color:'var(--red)'}}>₺{fmt(biz.exp)}</span></span>
      </div>
    </div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <span style={{fontSize:15,fontWeight:600}}>Ev Kasasi</span>
        <span style={{fontSize:20,fontWeight:700,color:hom.net>=0?'var(--green)':'var(--red)'}}>₺{fmt(hom.net)}</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--tx2)'}}>
        <span>Gelir: <span style={{color:'var(--green)'}}>₺{fmt(hom.inc)}</span></span>
        <span>Gider: <span style={{color:'var(--red)'}}>₺{fmt(hom.exp)}</span></span>
      </div>
    </div>
    <div className="card" style={{background:'var(--bg2)',border:'none'}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:13,color:'var(--tx2)',marginBottom:4}}>Toplam Net Bakiye</div>
        <div style={{fontSize:28,fontWeight:700,color:total.net>=0?'var(--green)':'var(--red)'}}>₺{fmt(total.net)}</div>
      </div>
    </div>
    <div className="section-title">Odeme Yontemine Gore</div>
    {['cash','card','transfer'].map(pm=>{
      const t=txns.filter(x=>x.pm===pm);
      const inc=t.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
      const exp=t.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
      return <div key={pm} className="card card-sm">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontWeight:600}}>{pmLabels[pm]}</span>
          <span style={{fontSize:13,color:'var(--tx2)'}}>{t.length} islem</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginTop:6}}>
          <span style={{color:'var(--green)'}}>+₺{fmt(inc)}</span>
          <span style={{color:'var(--red)'}}>−₺{fmt(exp)}</span>
          <span style={{fontWeight:600}}>Net: ₺{fmt(inc-exp)}</span>
        </div>
      </div>
    })}
  </div>;

  // STOCK TAB
  const StockTab=()=><div className="screen">
    <div className="header"><h1>Stok Yonetimi</h1><p>{stock.length} urun · Toplam: ₺{fmt(stockTotal)}</p></div>
    {stock.map(s=>{
      const change=s.buyPrice>0?((s.curPrice-s.buyPrice)/s.buyPrice*100):0;
      return <div key={s.id} className="list-item" onClick={()=>{setExpanded(expanded===s.id?null:s.id)}}>
        <div className="icon" style={{background:'rgba(0,122,255,.1)',color:'var(--blue)'}}>📦</div>
        <div className="info">
          <div className="name">{s.name}</div>
          <div className="meta">{s.supplier} · {fmtShort(s.date)} · {s.qty} adet</div>
          {expanded===s.id&&<div className="swipe-actions">
            <button className="act-edit" onClick={e=>{e.stopPropagation();setEditItem(s);setModal('stock')}}>Duzenle</button>
            <button className="act-del" onClick={e=>{e.stopPropagation();delStock(s.id)}}>Sil</button>
          </div>}
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:15,fontWeight:600}}>₺{fmt(s.curPrice)}</div>
          <div className={`stock-price ${change>=0?'up':'down'}`}>
            {change>=0?'↑':'↓'}{Math.abs(change).toFixed(1)}%
          </div>
        </div>
      </div>
    })}
    {stock.length===0&&<div className="empty">{Icons.empty}<p>Stok kaydi yok</p></div>}
  </div>;

  // REPORTS TAB
  const ReportTab=()=><div className="screen">
    <div className="header"><h1>Raporlar</h1></div>
    <div className="period-tabs">
      {[{v:'day',l:'Gunluk'},{v:'week',l:'Haftalik'},{v:'month',l:'Aylik'},{v:'year',l:'Yillik'}].map(p=>
        <button key={p.v} className={`period-tab ${period===p.v?'active':''}`} onClick={()=>setPeriod(p.v)}>{p.l}</button>
      )}
    </div>
    <div className="report-grid">
      <div className="report-card"><div className="rc-label">Gelir</div><div className="rc-val" style={{color:'var(--green)'}}>₺{fmt(pInc)}</div></div>
      <div className="report-card"><div className="rc-label">Gider</div><div className="rc-val" style={{color:'var(--red)'}}>₺{fmt(pExp)}</div></div>
      <div className="report-card"><div className="rc-label">Net Kar</div><div className="rc-val" style={{color:pInc-pExp>=0?'var(--green)':'var(--red)'}}>₺{fmt(pInc-pExp)}</div></div>
      <div className="report-card"><div className="rc-label">Islem Sayisi</div><div className="rc-val">{periodTxns.length}</div></div>
    </div>
    <div className="section-title">Kategorilere Gore Gelir</div>
    {catIncome.map(c=>{
      const t=periodTxns.filter(x=>x.type==='income'&&x.cat===c);
      const sum=t.reduce((s,x)=>s+x.amount,0);
      if(sum===0)return null;
      const pct=pInc>0?(sum/pInc*100):0;
      return <div key={c} className="card card-sm" style={{marginBottom:8}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontWeight:500,fontSize:14}}>{c}</span>
          <span style={{fontWeight:600,fontSize:14,color:'var(--green)'}}>₺{fmt(sum)}</span>
        </div>
        <div style={{background:'var(--bg3)',borderRadius:4,height:6,overflow:'hidden'}}>
          <div style={{width:`${pct}%`,height:'100%',background:'var(--green)',borderRadius:4,transition:'width .4s'}}/>
        </div>
      </div>
    })}
    <div className="section-title">Kategorilere Gore Gider</div>
    {catExpense.map(c=>{
      const t=periodTxns.filter(x=>x.type==='expense'&&x.cat===c);
      const sum=t.reduce((s,x)=>s+x.amount,0);
      if(sum===0)return null;
      const pct=pExp>0?(sum/pExp*100):0;
      return <div key={c} className="card card-sm" style={{marginBottom:8}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontWeight:500,fontSize:14}}>{c}</span>
          <span style={{fontWeight:600,fontSize:14,color:'var(--red)'}}>₺{fmt(sum)}</span>
        </div>
        <div style={{background:'var(--bg3)',borderRadius:4,height:6,overflow:'hidden'}}>
          <div style={{width:`${pct}%`,height:'100%',background:'var(--red)',borderRadius:4,transition:'width .4s'}}/>
        </div>
      </div>
    })}
    <div style={{padding:'0 20px',marginTop:16}}>
      <button className="btn btn-outline" onClick={()=>show('PDF raporu hazirlaniyor...')}>PDF Rapor Indir</button>
    </div>
  </div>;

  // Tab content
  const tabContent={home:<HomeTab/>,txn:<TxnTab/>,cash:<CashTab/>,stock:<StockTab/>,report:<ReportTab/>};

  return <>
    {tabContent[tab]}

    {(tab==='home'||tab==='txn')&&<button className="fab" onClick={()=>{setEditItem(null);setModal('txn')}}>{Icons.plus}</button>}
    {tab==='stock'&&<button className="fab" onClick={()=>{setEditItem(null);setModal('stock')}}>{Icons.plus}</button>}

    <nav className="tab-bar">
      {[{id:'home',icon:Icons.home,label:'Anasayfa'},{id:'txn',icon:Icons.list,label:'Islemler'},{id:'cash',icon:Icons.wallet,label:'Kasa'},{id:'stock',icon:Icons.box,label:'Stok'},{id:'report',icon:Icons.chart,label:'Raporlar'}].map(t=>
        <button key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
          {t.icon}<span>{t.label}</span>
        </button>
      )}
    </nav>

    <Modal open={modal==='txn'} onClose={()=>{setModal(null);setEditItem(null)}}>
      <TransactionForm item={editItem} onSave={saveTxn} onClose={()=>{setModal(null);setEditItem(null)}} onDelete={delTxn}/>
    </Modal>
    <Modal open={modal==='stock'} onClose={()=>{setModal(null);setEditItem(null)}}>
      <StockForm item={editItem} onSave={saveStock} onClose={()=>{setModal(null);setEditItem(null)}} onDelete={delStock}/>
    </Modal>

    {toast&&<Toast msg={toast} onDone={()=>setToast('')}/>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
