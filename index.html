<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#06060b;--b2:#0f0f16;--b3:#17171f;--b4:#222230;--tx:#eeeef3;--t2:#8b8b9e;--t3:#55556a;--a1:#8b5cf6;--a2:#c084fc;--g1:#10b981;--g2:#34d399;--r1:#ef4444;--r2:#f87171;--o1:#f59e0b;--bl:#3b82f6;--cd:#0d0d14;--bd:rgba(255,255,255,.05);--R:18px}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',sans-serif;overflow:hidden}
#a{height:100%;display:flex;flex-direction:column}
.P{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:115px;display:none}.P.on{display:block}
.H{padding:20px 20px 10px}.H h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.H p{font-size:13px;color:var(--t2);margin-top:2px}
.N{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(6,6,11,.94);backdrop-filter:blur(24px);border-top:1px solid var(--bd);padding:6px 2px max(env(safe-area-inset-bottom),10px);z-index:100}
.N button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;color:var(--t3);font:500 10px/1 inherit;cursor:pointer}.N button.on{color:var(--a2)}.N button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.G{background:var(--cd);border:1px solid var(--bd);border-radius:var(--R);padding:18px;margin:0 16px 14px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.3)}.G::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
.SR{display:flex;gap:10px;padding:0 16px;margin-bottom:14px}
.SC{flex:1;background:var(--b2);border:1px solid var(--bd);border-radius:var(--R);padding:16px;position:relative;overflow:hidden}.SC::after{content:'';position:absolute;top:-10px;right:-10px;width:70px;height:70px;border-radius:50%;filter:blur(35px);opacity:.12}.SC.sg::after{background:#10b981}.SC.sp::after{background:#8b5cf6}
.SC small{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;font-weight:600;display:block;margin-bottom:8px}.SC .V{font-size:20px;font-weight:800}
.AC{border-radius:var(--R);padding:18px;margin:0 16px 14px;display:flex;align-items:center;justify-content:space-between}.AC .al{font-size:13px;font-weight:600}.AC .av{font-size:22px;font-weight:800}
.ST{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;padding:20px 20px 8px}
.LR{display:flex;align-items:center;padding:14px 20px;gap:12px;cursor:pointer;border-bottom:1px solid var(--bd)}.LR:active{background:var(--b2)}
.LR .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.LR .inf{flex:1;min-width:0}.LR .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.LR .mt{font-size:11px;color:var(--t3);margin-top:2px}
.LR .rt{text-align:right;flex-shrink:0}.LR .am{font-size:15px;font-weight:800}.LR .tg{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:4px;display:inline-block}
.F{position:fixed;bottom:100px;right:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#c084fc);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:99;box-shadow:0 8px 30px rgba(139,92,246,.45)}.F:active{transform:scale(.82)}
.OV{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.MD{background:var(--b2);border-radius:28px 28px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:16px 20px max(env(safe-area-inset-bottom),24px)}.MH{width:40px;height:4px;background:var(--b4);border-radius:2px;margin:0 auto 20px}.MD h2{font-size:22px;font-weight:800;margin-bottom:20px}
.fg{margin-bottom:16px}.fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}.fg input,.fg textarea{width:100%;padding:14px 16px;border:1px solid var(--bd);border-radius:12px;font:15px inherit;background:var(--b3);color:var(--tx);outline:none}.fg input:focus,.fg textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(139,92,246,.15)}.fg textarea{min-height:60px;resize:vertical}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:16px;border:1px solid var(--bd)}.seg button{flex:1;padding:11px;border:none;border-radius:9px;font:600 13px/1 inherit;background:none;color:var(--t3);cursor:pointer}.seg button.on{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}.seg .sg{background:linear-gradient(135deg,#10b981,#34d399)}.seg .sr{background:linear-gradient(135deg,#ef4444,#f87171)}.seg .sd{background:linear-gradient(135deg,#8b5cf6,#c084fc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:8px 16px;border-radius:20px;font:500 12px/1 inherit;border:1px solid var(--bd);background:none;color:var(--t2);cursor:pointer}.chip.on{background:var(--a1);color:#fff;border-color:var(--a1)}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font:700 15px/1 inherit;cursor:pointer}.btn:active{transform:scale(.97)}.bp{background:linear-gradient(135deg,#8b5cf6,#c084fc);color:#fff;margin-bottom:8px}.bd{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;margin-bottom:8px}.bo{background:var(--b3);border:1px solid var(--bd);color:var(--tx);margin-top:6px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:14px}.rc{background:var(--b2);border:1px solid var(--bd);border-radius:var(--R);padding:16px}.rc small{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;font-weight:600;display:block;margin-bottom:6px}.rc .rv{font-size:18px;font-weight:800}
.ptabs{display:flex;padding:0 16px;margin-bottom:16px;gap:4px}.ptab{flex:1;padding:11px 0;text-align:center;font:600 12px/1 inherit;color:var(--t3);border:1px solid var(--bd);border-radius:12px;background:var(--b2);cursor:pointer}.ptab.on{background:var(--a1);color:#fff;border-color:var(--a1)}
.bw{display:flex;align-items:flex-end;gap:3px;height:90px;padding:0 20px;margin-bottom:4px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.bp2{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%}.bp2 div{flex:1;border-radius:4px 4px 0 0;min-height:2px}.bl{font-size:8px;color:var(--t3);text-transform:uppercase;font-weight:600}
.pb{background:var(--b4);border-radius:6px;height:5px;overflow:hidden;margin-top:8px}.pb div{height:100%;border-radius:6px}
.pmc{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0 16px 8px;background:var(--b2);border:1px solid var(--bd);border-radius:var(--R)}
.emp{text-align:center;padding:48px 20px;color:var(--t3)}.emp .ei{font-size:48px;opacity:.25;margin-bottom:8px}.emp p{font-size:13px;font-weight:500}
.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1;padding:10px;border:none;border-radius:12px;font:600 12px/1 inherit;cursor:pointer}.ae{background:var(--b4);color:var(--tx)}.ad{background:rgba(239,68,68,.1);color:var(--r1)}
.fc-card{border-radius:var(--R);padding:18px;margin:0 16px 14px;background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(251,191,36,.04));border:1px solid rgba(245,158,11,.2);position:relative;overflow:hidden}.fc-card::after{content:'📈';position:absolute;top:12px;right:16px;font-size:28px;opacity:.3}.fc-card .fl{font-size:11px;font-weight:700;color:var(--o1);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.fc-card .fv{font-size:26px;font-weight:800;color:var(--o1)}.fc-card .fs{font-size:12px;color:var(--t2);margin-top:6px}.fc-card .ft{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;margin-top:8px}.fu{background:rgba(16,185,129,.12);color:var(--g1)}.fd2{background:rgba(239,68,68,.12);color:var(--r1)}
.dw{display:flex;justify-content:center;padding:8px 0 16px}.dl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px;padding:0 16px}.dl span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--t2)}.dl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--a1);color:#fff;padding:12px 24px;border-radius:24px;font:600 13px/1 inherit;z-index:300;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 24px rgba(139,92,246,.4)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="a">
<div id="p-home" class="P on"></div><div id="p-txn" class="P"></div><div id="p-cash" class="P"></div><div id="p-stock" class="P"></div><div id="p-report" class="P"></div>
<button class="F" id="fab" onclick="oA()">+</button>
<nav class="N">
<button class="on" onclick="go('home',this)"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Ana Sayfa</span></button>
<button onclick="go('txn',this)"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span>İşlemler</span></button>
<button onclick="go('cash',this)"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span>Kasa</span></button>
<button onclick="go('stock',this)"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>Stok</span></button>
<button onclick="go('report',this)"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Raporlar</span></button>
</nav>
<div id="mbg" class="OV" style="display:none" onclick="if(event.target===this)cm()"><div class="MD"><div class="MH"></div><div id="mc"></div></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
var T=JSON.parse(localStorage.getItem('kf3_t')||'[]'),S=JSON.parse(localStorage.getItem('kf3_s')||'[]'),tab='home',per='month',eId=null;
function sv(){localStorage.setItem('kf3_t',JSON.stringify(T));localStorage.setItem('kf3_s',JSON.stringify(S))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fm(n){return n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(d){return new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function td(){return new Date().toISOString().split('T')[0]}
var PL={cash:'Nakit',card:'Kart',transfer:'Havale'},PC={cash:'#10b981',card:'#8b5cf6',transfer:'#f59e0b'},RL={business:'İş Yeri',home:'Ev'};
var CI=['Saç Kesim','Saç Boyası','Makyaj','Cilt Bakım','Tırnak','Masaj','Ağda','Kaş Dizayn','Fön','Diğer'];
var CE=['Malzeme','Kira','Elektrik','Su','İnternet','Personel','Vergi','Temizlik','Diğer'];
function go(t,b){tab=t;document.querySelectorAll('.P').forEach(function(p){p.classList.remove('on')});document.getElementById('p-'+t).classList.add('on');document.querySelectorAll('.N button').forEach(function(x){x.classList.remove('on')});if(b)b.classList.add('on');document.getElementById('fab').style.display=(t==='home'||t==='txn'||t==='stock')?'flex':'none';R()}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}
function om(h){document.getElementById('mc').innerHTML=h;document.getElementById('mbg').style.display='flex'}
function cm(){document.getElementById('mbg').style.display='none'}
function cR(r){var f=T.filter(function(t){return t.reg===r}),i=f.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+t.amount},0),e=f.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);return{i:i,e:e,n:i-e}}
function cPM(tp,l){var r={};['cash','card','transfer'].forEach(function(pm){var f=l.filter(function(t){return t.type===tp&&t.pm===pm});r[pm]={c:f.length,t:f.reduce(function(s,t){return s+t.amount},0)}});return r}
function cAvg(){var inc=T.filter(function(t){return t.type==='income'&&t.reg==='business'});if(!inc.length)return 0;var d={};inc.forEach(function(t){d[t.date]=1});return inc.reduce(function(s,t){return s+t.amount},0)/Object.keys(d).length}
function fc(){var n=new Date(),cm2=n.getMonth(),cy=n.getFullYear(),pm2=cm2===0?11:cm2-1,py=cm2===0?cy-1:cy,m1=0,m1d=0,m2=0,m2d=0;T.forEach(function(t){if(t.type!=='income'||t.reg!=='business')return;var d=new Date(t.date);if(d.getMonth()===cm2&&d.getFullYear()===cy){m1+=t.amount;m1d=Math.max(m1d,d.getDate())}if(d.getMonth()===pm2&&d.getFullYear()===py){m2+=t.amount;m2d=new Date(py,pm2+1,0).getDate()}});var a1=m1d>0?m1/m1d:0,a2=m2d>0?m2/m2d:0,gr=a2>0?((a1-a2)/a2):0,na=a1*(1+gr),nm=na*30,dim=new Date(cy,cm2+1,0).getDate(),rem=dim-n.getDate();return{da:a1,la:a2,gr:gr*100,tf:m1+(a1*rem),nf:nm,cur:m1,last:m2,rem:rem}}
function pf(t){var d=new Date(t.date),n=new Date();if(per==='day')return d.toDateString()===n.toDateString();if(per==='week'){var w=new Date(n);w.setDate(w.getDate()-7);return d>=w}if(per==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();if(per==='year')return d.getFullYear()===n.getFullYear();return true}
function oA(){if(tab==='stock')oSF(null);else oTF(null)}
function oTF(item){var tp=item?item.type:'income',rg=item?item.reg:'business',h='<h2>'+(item?'Düzenle':'Yeni İşlem')+'</h2>';h+='<div class="seg" id="st"><button class="'+(tp==='income'?'on sg':'')+'" onclick="sT(\'income\',this)">Gelir</button><button class="'+(tp==='expense'?'on sr':'')+'" onclick="sT(\'expense\',this)">Gider</button></div>';h+='<div class="fg"><label>Kasa</label><div class="seg" id="sr"><button class="'+(rg==='business'?'on sd':'')+'" onclick="sRg(this)">İş Yeri</button><button class="'+(rg==='home'?'on sd':'')+'" onclick="sRg(this)">Ev</button></div></div>';h+='<div class="fg"><label>Açıklama</label><input id="fd" value="'+(item?item.desc:'')+'" placeholder="Saç kesim, boya..."/></div>';h+='<div class="fg"><label>Tutar (₺)</label><input id="fa" type="number" inputmode="decimal" value="'+(item?item.amount:'')+'" placeholder="0.00"/></div>';h+='<div class="fg"><label>Ödeme Yöntemi</label><div class="chips" id="fp">';['cash','card','transfer'].forEach(function(p){h+='<button class="chip'+((item?item.pm:'cash')===p?' on':'')+'" onclick="pc(this,\'fp\')">'+PL[p]+'</button>'});h+='</div></div>';h+='<div class="fg"><label>Kategori</label><div class="chips" id="fcc">';(tp==='income'?CI:CE).forEach(function(c){h+='<button class="chip'+((item&&item.cat===c)?' on':'')+'" onclick="pc(this,\'fcc\')">'+c+'</button>'});h+='</div></div>';h+='<div class="fg"><label>Tarih</label><input id="fdt" type="date" value="'+(item?item.date:td())+'"/></div>';h+='<div class="fg"><label>Not</label><textarea id="fn" placeholder="Opsiyonel...">'+(item?item.notes||'':'')+'</textarea></div>';h+='<input type="hidden" id="ft" value="'+tp+'"/>';h+='<button class="btn bp" onclick="svT(\''+(item?item.id:'')+'\')" >Kaydet</button>';if(item)h+='<button class="btn bd" onclick="dT(\''+item.id+'\')">Sil</button>';h+='<button class="btn bo" onclick="cm()">İptal</button>';om(h)}
function sT(v,b){document.getElementById('ft').value=v;document.querySelectorAll('#st button').forEach(function(x){x.className=''});b.className='on '+(v==='income'?'sg':'sr');var cw=document.getElementById('fcc');cw.innerHTML='';(v==='income'?CI:CE).forEach(function(c){var bt=document.createElement('button');bt.className='chip';bt.textContent=c;bt.onclick=function(){pc(bt,'fcc')};cw.appendChild(bt)})}
function sRg(b){document.querySelectorAll('#sr button').forEach(function(x){x.className=''});b.className='on sd'}
function pc(b,id){document.getElementById(id).querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});b.classList.add('on')}
function gv(id){var e=document.querySelector('#'+id+' .chip.on');return e?e.textContent:''}
function svT(eid){var desc=document.getElementById('fd').value.trim(),amt=parseFloat(document.getElementById('fa').value);if(!desc||!amt||isNaN(amt))return toast('Açıklama ve tutar gerekli!');var type=document.getElementById('ft').value,pm=gv('fp')||'Nakit',pmk=Object.keys(PL).find(function(k){return PL[k]===pm})||'cash',rb=document.querySelector('#sr .on'),reg=rb&&rb.textContent.trim()==='Ev'?'home':'business',cat=gv('fcc')||(type==='income'?CI[0]:CE[0]),date=document.getElementById('fdt').value||td(),note=document.getElementById('fn').value.trim();var obj={id:eid||uid(),type:type,desc:desc,amount:amt,pm:pmk,reg:reg,cat:cat,date:date,notes:note,ts:Date.now()};if(eid){var i=T.findIndex(function(t){return t.id===eid});if(i>=0)T[i]=obj}else T.unshift(obj);sv();cm();toast('Kaydedildi ✓');R()}
function dT(id){T=T.filter(function(t){return t.id!==id});sv();cm();toast('Silindi');R()}
function oSF(item){var h='<h2>'+(item?'Stok Düzenle':'Yeni Stok')+'</h2>';h+='<div class="fg"><label>Ürün Adı</label><input id="sn" value="'+(item?item.name:'')+'"/></div><div class="fg"><label>Tedarikçi</label><input id="ss" value="'+(item?item.supplier:'')+'"/></div><div class="fg"><label>Alış Fiyatı (₺)</label><input id="sb" type="number" inputmode="decimal" value="'+(item?item.buyPrice:'')+'"/></div><div class="fg"><label>Güncel Fiyat (₺)</label><input id="sc" type="number" inputmode="decimal" value="'+(item?item.curPrice:'')+'"/></div><div class="fg"><label>Miktar</label><input id="sq" type="number" inputmode="numeric" value="'+(item?item.qty:'')+'"/></div><div class="fg"><label>Alış Tarihi</label><input id="sd" type="date" value="'+(item?item.date:td())+'"/></div><div class="fg"><label>Not</label><textarea id="sno">'+(item?item.notes||'':'')+'</textarea></div>';h+='<button class="btn bp" onclick="svS(\''+(item?item.id:'')+'\')" >Kaydet</button>';if(item)h+='<button class="btn bd" onclick="dS(\''+item.id+'\')">Sil</button>';h+='<button class="btn bo" onclick="cm()">İptal</button>';om(h)}
function svS(eid){var name=document.getElementById('sn').value.trim(),bp=parseFloat(document.getElementById('sb').value),qty=parseInt(document.getElementById('sq').value);if(!name||!bp||!qty)return toast('Bilgileri doldurun!');var obj={id:eid||uid(),name:name,supplier:document.getElementById('ss').value.trim(),buyPrice:bp,curPrice:parseFloat(document.getElementById('sc').value)||bp,qty:qty,date:document.getElementById('sd').value||td(),notes:document.getElementById('sno').value.trim(),ts:Date.now()};if(eid){var i=S.findIndex(function(s){return s.id===eid});if(i>=0)S[i]=obj}else S.unshift(obj);sv();cm();toast('Kaydedildi ✓');R()}
